name: Build RasyAI Sitamiang APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Debby HTML
        run: |
          unzip -o Debby_Barcode.zip -d extracted

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/rahmatsyariah/sitamiang
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp extracted/Debby.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RasyAI-Sitamiang"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rahmatsyariah.sitamiang'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rahmatsyariah.sitamiang'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="RasyAI Sitamiang"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rahmatsyariah/sitamiang/MainActivity.java <<'EOF'
          package com.rahmatsyariah.sitamiang;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends AppCompatActivity {

              private static final int CAMERA_REQUEST = 1001;
              private WebView webView;

              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader.AssetsPathHandler(this)
                                  )
                                  .build();

                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public android.webkit.WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              android.webkit.WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (android.os.Build.VERSION.SDK_INT >= 23 &&
                                  checkSelfPermission(Manifest.permission.CAMERA)
                                          != PackageManager.PERMISSION_GRANTED) {

                                  requestPermissions(
                                          new String[]{Manifest.permission.CAMERA},
                                          CAMERA_REQUEST
                                  );
                                  return;
                              }

                              request.grant(request.getResources());
                          });
                      }
                  });

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.CAMERA)
                              != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_REQUEST
                      );
                  }

                  webView.loadUrl(
                          "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode == CAMERA_REQUEST &&
                      grantResults.length > 0 &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {

                      webView.reload();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RasyAI-Sitamiang-Barcode-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
